# Continuous deployment to the TDEV VPS (admin-mail.ourtdev.com) on every push to main.
#
# No GitHub secrets needed:
#  - the image is pushed to GHCR with the GITHUB_TOKEN provided by Actions;
#  - the VPS is triggered with a GitHub-signed OIDC token, verified by the
#    deployer service (repository, main branch). App secrets stay on the VPS.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/tdevcommunity/gestion-mail

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          docker buildx create --use --driver docker-container >/dev/null
          docker buildx build -f Dockerfile.prod \
            --build-arg LISTMONK_VERSION=tdev-${GITHUB_SHA::7} \
            --build-arg LISTMONK_COMMIT=${GITHUB_SHA::7} \
            --cache-from type=registry,ref=${{ env.IMAGE }}:buildcache \
            --cache-to type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max \
            -t ${{ env.IMAGE }}:main -t ${{ env.IMAGE }}:sha-${{ github.sha }} \
            --push .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment on the VPS
        run: |
          set -euo pipefail
          token=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://admin-hub.ourtdev.com" | jq -r .value)
          echo "::add-mask::$token"
          status=$(curl -sS -o response.json -w '%{http_code}' --max-time 600 \
            -X POST -H "Authorization: Bearer $token" https://admin-hub.ourtdev.com/deploy)
          cat response.json; echo
          test "$status" = "200"
